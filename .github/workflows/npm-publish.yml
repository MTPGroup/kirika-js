name: Publish npm Packages

on:
  pull_request:
    branches:
      - master
    types:
      - closed

permissions:
  contents: write
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.ref == 'changeset-release/master'
    runs-on: ubuntu-latest
    environment: npm

    steps:
      - name: Checkout merged release
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.18.0
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Update npm for trusted publishing
        run: npm install --global npm@latest

      - name: Check formatting and linting
        run: pnpm format-and-lint

      - name: Check types
        run: pnpm check-types

      - name: Run tests
        run: pnpm test

      - name: Build publishable packages
        run: >-
          pnpm turbo run build
          --filter=@kirika-js/core
          --filter=@kirika-js/adapter-model-openai-compatible
          --filter=@kirika-js/adapter-persistence-sqlite
          --filter=@kirika-js/adapter-storage-filesystem
          --filter=@kirika-js/adapter-storage-s3
          --filter=@kirika-js/adapter-character-card-kirika
          --filter=@kirika-js/adapter-character-card-external

      - name: Publish packages
        run: pnpm changeset publish

      - name: Push release tags
        run: git push --follow-tags
