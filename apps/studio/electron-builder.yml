appId: cn.kirika.studio
productName: Kirika Studio

directories:
  buildResources: build
  output: dist

files:
  - out/**
  - package.json

extraResources:
  - from: ../../packages/adapter-persistence-sqlite/drizzle
    to: migrations/sqlite
    filter:
      - "**/*"

win:
  executableName: kirika-studio
  icon: build/icons/win/icon.ico
  target:
    - nsis

nsis:
  artifactName: kirika-studio-${version}-${arch}-setup.${ext}
  shortcutName: Kirika Studio
  uninstallDisplayName: Kirika Studio
  createDesktopShortcut: always

mac:
  icon: build/icons/mac/icon.icns
  target:
    - dmg
    - zip
  category: public.app-category.developer-tools
  entitlementsInherit: build/entitlements.mac.plist
  notarize: false

dmg:
  artifactName: kirika-studio-${version}-${arch}.${ext}

linux:
  executableName: kirika-studio
  icon: build/icons/png/1024x1024.png
  target:
    - AppImage
    - deb
  category: Development
  maintainer: MTPGroup
  syncDesktopName: true

appImage:
  artifactName: kirika-studio-${version}-${arch}.${ext}

deb:
  artifactName: kirika-studio-${version}-${arch}.${ext}

npmRebuild: false

electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/
