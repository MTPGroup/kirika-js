name: kirika

services:
  postgres:
    image: postgres:18.4-alpine
    environment:
      POSTGRES_DB: ${PG_DB:-kirka}
      POSTGRES_USER: ${PG_USER:-kirika}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-kirika_dev}
    ports:
      - "127.0.0.1:${PG_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/18
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-azusa} -d ${PG_DB:-azusa}"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 5s
    restart: unless-stopped

volumes:
  postgres-data:
