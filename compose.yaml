name: kirika

services:
  postgres:
    image: postgres:18.4-alpine
    environment:
      POSTGRES_DB: ${PG_DB:-kirika}
      POSTGRES_USER: ${PG_USER:-kirika}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-kirika_dev}
    ports:
      - "127.0.0.1:${PG_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/18
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${PG_USER:-kirika} -d ${PG_DB:-kirika}"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 5s
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"
      - "1025:1025"

volumes:
  postgres-data:
