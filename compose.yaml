name: kirika

services:
  postgres:
    image: postgres:18.4-alpine
    environment:
      POSTGRES_DB: ${PG_DB:-kirika}
      POSTGRES_USER: ${PG_USER:-kirika}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-kirika_dev}
    ports:
      - "127.0.0.1:${PG_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/18
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${PG_USER:-kirika} -d ${PG_DB:-kirika}"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 5s
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"
      - "1025:1025"

  rustfs:
    image: rustfs/rustfs:latest
    restart: unless-stopped
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_EXTERNAL_ADDRESS: :9000
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:-kirika_dev}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:-kirika_dev}
    healthcheck:
      test:
        [
          "CMD",
          "sh",
          "-c",
          "curl -f http://localhost:9000/health && curl -f http://localhost:9001/rustfs/console/health",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - rustfs-data:/data:z

volumes:
  postgres-data:
  rustfs-data:
